name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fabric:
    name: Fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.4', '1.21.8', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build
        env:
          DIST_DIR: dist
        run: node tools/build-version.mjs ${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error

  neoforge:
    name: NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build
        working-directory: neoforge
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
