name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Fabric (all versions)
        run: node tools/build-version.mjs 1.21.1 1.21.4 1.21.8 1.21.11

      - name: Build NeoForge
        working-directory: neoforge
        run: gradle build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p out
          cp ../dist/*.jar out/ 2>/dev/null || true
          cp neoforge/build/libs/*.jar out/
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.jar
          generate_release_notes: true
